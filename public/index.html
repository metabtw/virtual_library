<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171513">
  <title>Sanal Kütüphane</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/room-preferences.css">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#room"><span>◫</span><b>Sanal<br>Kütüphane</b></a>
    <nav aria-label="Ana menü">
      <a href="#rooms"><i aria-hidden="true">⌂</i> Odalar</a>
      <a href="#room"><i aria-hidden="true">▤</i> Kütüphane</a>
      <a href="#shop"><i aria-hidden="true">♧</i> Mağaza</a>
      <a href="#profile"><i aria-hidden="true">♙</i> Profil &amp; Envanter</a>
    </nav>
    <div class="sidebar-footer"><span class="dot"></span> Kütüphane açık</div>
  </aside>
  <main>
    <header><span class="breadcrumb">Sanal Kütüphane <span>›</span> <b id="location">Kütüphane</b></span><div class="wallet"><span>◉</span> <b id="balance">0</b> jeton</div></header>
    <section id="content" aria-label="Kütüphane"></section>
  </main>
  <p id="notice" role="status"></p>
  <dialog id="verify-dialog"><h2>Hâlâ masada mısın?</h2><p>Çalışma periyodunu doğrulamak için kalan süre <b id="verify-time"></b>.</p><div class="dialog-actions"><button class="primary" data-action="verify">Buradayım</button><button class="secondary" data-action="status" data-value="break">Molaya geç</button></div></dialog>
  <dialog id="reaction-dialog">
    <h2>Masa tepkisi</h2>
    <div class="dialog-actions"><button class="primary" data-action="react" data-value="coffee">☕ Kahve gönder</button>
      <button class="secondary" data-action="react" data-value="clap">👏 Alkışla</button>
      <form method="dialog"><button class="secondary">Kapat</button></form></div>
  </dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
